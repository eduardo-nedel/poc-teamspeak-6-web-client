version: '3.8'

services:
  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ts6-web-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ts6-web-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - gateway
